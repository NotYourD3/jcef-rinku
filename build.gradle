plugins {
    id 'java'
    id 'idea'
}

group = 'org.jcef'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// ========================================================================
// repositories: 将 third_party/*/*.jar 都暴露为 flat 仓库
// ========================================================================
repositories {
    flatDir {
        dirs 'third_party/jabel'
    }
    flatDir {
        dirs 'third_party/junit'
    }
    flatDir {
        dirs 'third_party/jogamp/jar'
    }
}

// ========================================================================
// Source Sets
// ========================================================================
sourceSets {
    main {
        java {
            srcDirs = ['java']
            include 'org/cef/**/*.java'
        }
        resources {
            srcDir 'java'
            include 'manifest/MANIFEST.MF'
        }
    }
    test {
        java {
            srcDirs = ['java']
            include 'tests/junittests/**/*.java'
        }
    }
    samples {
        java {
            srcDirs = ['java']
            include 'tests/detailed/**/*.java'
            include 'tests/simple/**/*.java'
        }
        resources {
            srcDir 'java'
            include 'tests/detailed/**'
            exclude 'tests/detailed/**/*.java'
        }
    }
}

dependencies {
    // --- ASM 字节码库 (给 DesugarTransformer 用) ---
    implementation name: 'asm-9.6'
    implementation name: 'asm-commons-9.6'
    implementation name: 'asm-tree-9.6'

    // --- streamsupport: Java 8 集合/流 backport ---
    implementation name: 'streamsupport-1.7.2'

    // --- JOGL & GlueGen 运行时 ---
    implementation name: 'gluegen-rt'
    implementation name: 'jogl-all'

    // --- JUnit (测试专用) ---
    testImplementation name: 'junit-platform-console-standalone-6.1.2'
    testImplementation sourceSets.main.output
    testImplementation sourceSets.samples.output

    // --- samples 依赖主代码 + streamsupport + jogl ---
    samplesImplementation sourceSets.main.output
    samplesImplementation name: 'streamsupport-1.7.2'
    samplesImplementation name: 'gluegen-rt'
    samplesImplementation name: 'jogl-all'
}

idea {
    module {
        // 告诉 IDEA 所有 source roots 都在 java/ 下
        sourceDirs += file('java')
        // 让 streamsupport/asm/jogamp/junit 这些 jar 都被 IDEA 作为库可见
        downloadSources = false
        downloadJavadoc = false
    }
}

// ========================================================================
// 编译参数：根据 JDK 版本启用 Jabel 插件
// ========================================================================
def isJava8 = JavaVersion.current() == JavaVersion.VERSION_1_8
def jabelJar = file('third_party/jabel/jabel-1.1.0.jar')
def asmClasspath = files(
    'third_party/jabel/asm-9.6.jar',
    'third_party/jabel/asm-commons-9.6.jar',
    'third_party/jabel/asm-tree-9.6.jar'
)
def streamsupportJar = file('third_party/jabel/streamsupport-1.7.2.jar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = false
    options.debug = true
    options.fork = true

    if (!isJava8) {
        // --- Jabel 在 javac 的 annotation processor 搜索路径上 ---
        options.annotationProcessorPath = options.annotationProcessorPath == null \
            ? files(jabelJar)
            : files(options.annotationProcessorPath, jabelJar)

        // --- JDK 9+ JVM 参数 (给 Forked javac 进程的 JVM 用) ---
        options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        ]
        options.compilerArgs += ['-Xplugin:jabel']
    }
}

compileJava {
    doFirst {
        println "=================================="
        println "Java version: ${JavaVersion.current()}"
        println "Target bytecode: Java 8 (1.8)"
        if (isJava8) {
            println "WARNING: Running under JDK 8. Jabel plugin DISABLED."
        } else {
            println "JDK 9+ detected. Jabel plugin ACTIVE."
        }
        println "=================================="
    }
}

// ========================================================================
// 任务: Desugar 字节码转换
// ========================================================================
tasks.register('desugar') {
    dependsOn compileJava, compileSamplesJava
    description = 'Rewrite List.of / Map.of etc. bytecode to Java 8 backports'

    doLast {
        def allDirs = []
        allDirs.addAll(sourceSets.main.output.classesDirs.files)
        allDirs.addAll(sourceSets.samples.output.classesDirs.files)

        println "Running DesugarTransformer on ${allDirs.size()} class dirs..."
        def transformedCount = 0
        allDirs.each { dir ->
            def baos = new ByteArrayOutputStream()
            def execResult = javaexec {
                mainClass = 'org.cef.desugar.DesugarTransformer'
                classpath = files(
                    sourceSets.main.output.classesDirs,
                    sourceSets.main.output.resourcesDir,
                    asmClasspath
                )
                args dir.absolutePath
                setStandardOutput baos
                setErrorOutput baos
                setIgnoreExitValue true
            }
            def outputStr = baos.toString()
            println outputStr.trim()
            def m = outputStr =~ /transformed\s+(\d+)\s+class/
            if (m) transformedCount += (m[0][1] as int)
            if (execResult.exitValue != 0) {
            }
        }
        println "Desugar complete. Total transformed: ${transformedCount} class files."
    }
}

classes {
    finalizedBy 'desugar'
}

// ========================================================================
// 打包: jcef.jar + jcef-tests.jar
// ========================================================================
tasks.register('jcefTestsJar', Jar) {
    dependsOn compileTestJava, compileSamplesJava, desugar
    archiveBaseName = 'jcef-tests'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.test.output.classesDirs
    from sourceSets.test.output.resourcesDir
    from sourceSets.samples.output.classesDirs
    from sourceSets.samples.output.resourcesDir
}

jar {
    dependsOn desugar, jcefTestsJar
    archiveBaseName = 'jcef'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('libs')

    manifest {
        from('java/manifest/MANIFEST.MF')
    }

    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir

    // --- 内嵌 streamsupport backport 类 (fat jar) ---
    from(zipTree(streamsupportJar)) {
        exclude 'META-INF/**'
    }

    doLast {
        println ""
        println "========== BUILD COMPLETE =========="
        def out = layout.buildDirectory.dir('libs').get().asFile
        println "Output: $out"
        out.listFiles().sort().each { f ->
            def kb = (f.length() / 1024).round(1)
            println "  ${f.name}  ($kb KB)"
        }

        // ---------- 字节码版本校验 ----------
        println ""
        println "========== VERIFICATION =========="
        def jcefJar = new File(out, 'jcef.jar')
        def tmpDir = new File(buildDir, 'verify-tmp-' + System.currentTimeMillis())
        tmpDir.deleteDir()
        tmpDir.mkdirs()
        copy {
            from zipTree(jcefJar)
            into tmpDir
        }
        def klass = new File(tmpDir, 'org/cef/CefApp.class')
        if (klass.exists()) {
            def b = klass.bytes
            int major = ((b[6] & 0xFF) << 8) | (b[7] & 0xFF)
            def label = major == 52 ? 'Java 8 ✓' : "Java ${major-44} ✗ (EXPECTED 52=Java8)"
            println "  Bytecode version (org.cef.CefApp):  major=$major  ->  $label"
            if (major != 52) {
                tmpDir.deleteDir()
            }
        }

        // ---------- Desugar 校验: 没有遗留 List.of 字节码引用 ----------
        def jarBytes = jcefJar.bytes
        def s = new String(jarBytes, 'ISO-8859-1')
        def rawOk = true
        [
            'java/util/List.of(',
            'java/util/Set.of(',
            'java/util/Map.of(',
            'java/util/Objects.requireNonNullElse(',
            'java/lang/String.isBlank()',
            'java/lang/String.repeat(',
            'java/lang/String.strip()'
        ].each { pat ->
            if (s.contains(pat)) {
                println "  WARN: Found raw '$pat' in jar (desugar did not convert this pattern)"
                rawOk = false
            }
        }
        if (rawOk) {
            println "  Desugar API check:  ALL JAVA9+ CALLS REWRITTEN  ✓"
        } else {
            println "  Desugar API check:  SOME CALLS NOT CONVERTED  ✗"
        }

        tmpDir.deleteDir()
        println ""
        println "===================================="
    }
}

tasks.register('copyLibs') {
    dependsOn jar
    doLast {
        copy {
            from streamsupportJar
            into layout.buildDirectory.dir('libs')
        }
    }
}

build {
    dependsOn 'copyLibs'
}

defaultTasks 'build'